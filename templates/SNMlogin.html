<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>

    <h2>Login</h2>

    <form action="/login" method="POST">

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">
            Login
        </button>

        <br><br>

        <a href="/forgot-password">Forgot Password?</a>

    </form>

</body>

</html>
