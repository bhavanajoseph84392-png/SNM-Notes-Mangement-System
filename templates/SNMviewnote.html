<!DOCTYPE html>
<html>

<head>
    <title>View Note</title>
</head>

<body>

    <h2>{{ note[2] }}</h2>

    <p>
        {{ note[3] }}
    </p>

    <p>
        Created At: {{ note[4] }}
    </p>

    <p>
        Updated At: {{ note[5] }}
    </p>

    <br>

    <!-- Edit Note -->
    <a href="{{ url_for('update_note', note_id=note[0]) }}">
        Edit Note
    </a>

    <br><br>

    <!-- Upload File -->
    <a href="{{ url_for('upload_file', note_id=note[0]) }}">
        Upload File
    </a>

    <br><br>

    <!-- Delete Note -->
    <form
        action="{{ url_for('delete_note', note_id=note[0]) }}"
        method="POST"
    >

        <button
            type="submit"
            onclick="return confirm('Are you sure you want to delete this note?')"
        >
            Delete Note
        </button>

    </form>

    <br><br>

    <!-- Back to Notes -->
    <a href="{{ url_for('view_notes') }}">
        Back to Notes
    </a>

</body>

</html>
