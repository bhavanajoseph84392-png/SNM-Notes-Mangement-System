<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>

<body>

    <h2>Forgot Password</h2>

    <form
        action="/forgot-password"
        method="POST"
    >

        <label>Email:</label>

        <input
            type="email"
            name="email"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>

</body>
</html>
