<!DOCTYPE html>
<html>

<head>
    <title>My Uploaded Files</title>
</head>

<body>

    <h2>My Uploaded Files</h2>

    <hr>

    {% for file in files %}

        <p>
            <strong>File Name:</strong>
            {{ file[2] }}
        </p>

        <p>
            <strong>Note:</strong>
            {{ file[5] }}
        </p>

        <!-- Download files of this particular note -->
        <a href="{{ url_for('download_note_files_excel', note_id=file[1]) }}">
            <button type="button">
                Download {{ file[5] }} Files as Excel
            </button>
        </a>

        <p>
            <strong>Uploaded At:</strong>
            {{ file[4] }}
        </p>

        <br>

        <!-- View File -->
        <a href="{{ url_for('view_file', file_id=file[0]) }}">
            View File
        </a>

        <br><br>

        <!-- Download Individual File -->
        <a href="{{ url_for('download_file', file_id=file[0]) }}">
            Download File
        </a>

        <br><br>

        <!-- Delete File -->
        <form action="{{ url_for('delete_file', file_id=file[0]) }}"
              method="POST">

            <button type="submit"
                    onclick="return confirm('Are you sure you want to delete this file?')">
                Delete File
            </button>

        </form>

        <hr>

    {% else %}

        <p>No files uploaded.</p>

    {% endfor %}

    <br><br>

    <a href="{{ url_for('dashboard') }}">
        Back to Dashboard
    </a>

</body>

</html>
