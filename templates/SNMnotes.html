{% for note in user_note %}

    <hr>

    <h3>{{ note[2] }}</h3>

    <p>{{ note[3] }}</p>

    <p>
        Created At: {{ note[4] }}
    </p>

    <p>
        Updated At: {{ note[5] }}
    </p>

    <a href="{{ url_for('view_single_note', note_id=note[0]) }}">
        View
    </a>

    <br><br>

    <a href="{{ url_for('update_note', note_id=note[0]) }}">
        Edit
    </a>

    <br><br>

    <form
        action="{{ url_for('delete_note', note_id=note[0]) }}"
        method="POST"
    >

        <button
            type="submit"
            onclick="return confirm('Are you sure you want to delete this note?')"
        >
            Delete
        </button>

    </form>

{% else %}

    <p>No notes available.</p>

{% endfor %}
