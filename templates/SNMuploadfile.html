<!DOCTYPE html>
<html>
<head>
    <title>Upload File</title>
</head>
<body>

    <h2>Upload File</h2>

    <form action="{{ url_for('upload_file', note_id=note_id) }}"
          method="POST"
          enctype="multipart/form-data">

        <label>Select File:</label>

        <input type="file" name="file" required>

        <br><br>

        <button type="submit">Upload File</button>

    </form>

</body>
</html>
